name: iOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Validate Podspec
        run: pod spec lint ios/VeryOauthSDK.podspec --allow-warnings

      - name: Push to CocoaPods
        run: pod trunk push ios/VeryOauthSDK.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOA_PODS_TRUNK_TOKEN }}

      # GitHub release is created by android-release.yml only.
