name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Setup GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          gpg --list-secret-keys

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # android/gradle/wrapper/gradle-wrapper.jar is not committed, so
      # ./gradlew cannot bootstrap. Use the wrapper's Gradle version directly.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build and Test
        working-directory: android
        run: gradle :veryoauthsdk:build :veryoauthsdk:test

      - name: Generate Documentation
        working-directory: android
        run: gradle :veryoauthsdk:dokkaHtml

      - name: Publish to Maven Central
        working-directory: android
        run: gradle :veryoauthsdk:publishReleasePublicationToOSSRHRepository
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEY_RING_FILE: ${{ secrets.SIGNING_SECRET_KEY_RING_FILE }}

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: android-docs
          path: android/veryoauthsdk/build/dokka/

      # The only workflow that creates the GitHub release (ios-release.yml
      # publishes to CocoaPods only), so a v* tag no longer creates it twice.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## VeryOauthSDK ${{ github.ref_name }}

            ### Android
            ```gradle
            implementation 'org.very:veryoauthsdk:<version>'
            ```

            ### iOS
            ```ruby
            pod 'VeryOauthSDK'
            ```

            Or via Swift Package Manager:
            ```
            https://github.com/veroslabs/very-oauth-sdk.git
            ```
          draft: false
          prerelease: false
